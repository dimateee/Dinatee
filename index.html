<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Лендинг можно увеличивать (доступность). В приложении скрипт ниже добавляет maximum-scale=1 —
         иначе iPhone приближает экран при нажатии на каждое поле ввода. -->
    <meta name="viewport" id="vp" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090B" />
    <meta name="color-scheme" content="dark" />
    <title>RITM — тренировки, питание и привычки</title>
    <meta name="description" content="Программа силовых и бега под твою цель, калории по фото еды, задачи, привычки и прогресс. Сайт, приложение на Android и iPhone и Mini App в Telegram — один аккаунт." />

    <!-- Приложение с сайта (PWA): Android — «Установить», iPhone — «На экран „Домой“» -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="RITM" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="RITM — тренировки, питание и привычки" />
    <meta property="og:description" content="Программа тренировок, калории по фото, задачи и привычки. Сайт, Android, iPhone и Telegram." />
    <!-- %SITE_URL% при сборке заменяется на адрес сайта (на Netlify — переменная URL, см. vite.config.js):
         соцсети и мессенджеры принимают картинку превью только по полному адресу -->
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Шрифты — с самого сайта (src/fonts.css, public/fonts). Заранее грузим то, что видно на первом
         экране: заголовки (Geologica) и текст (Onest) с кириллицей, плюс латиницу заголовков (RITM, цифры). -->
    <link rel="preload" href="/fonts/geologica-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sofia-sans-extra-condensed-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geologica-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Telegram Mini Apps SDK: даёт window.Telegram.WebApp. На сайте тоже подключён — по пустым
         initData приложение понимает, что открыто не в Telegram (см. src/web.js). -->
    <!-- defer: скрипт больше не задерживает первую отрисовку страницы, но по-прежнему выполняется
         раньше /src/main.jsx (отложенные и модульные скрипты выполняются по порядку). -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <!-- Готовый HTML лендинга (вставляется при сборке, scripts/prerender.mjs) нужен только посетителям сайта.
         Тем, кто открывает приложение (Mini App, /app, вошедшие на сайте, установленное и нативное приложение),
         вместо него сразу показываем экран загрузки — те же условия, что в src/main.jsx. -->
    <script>
      (function () {
        try {
          var path = location.pathname.replace(/\/+$/, "");
          var app = /tgWebAppData/.test(location.hash) || path === "/app" || path.indexOf("/app/") === 0
            || !/^https?:$/.test(location.protocol) || !!window.RITM_ELECTRON
            || !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
            || navigator.standalone === true || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
          if (!app) { try { var s = JSON.parse(localStorage.getItem("ritm-web-session") || "null"); app = !!(s && s.token && s.user && s.user.id); } catch (e) {} }
          if (!app) { try { app = !!sessionStorage.getItem("__telegram__initParams"); } catch (e) {} }
          if (app) {
            document.documentElement.className += " app-mode";
            document.getElementById("vp").setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
            // Код приложения качаем сразу, параллельно с основным скриптом, а не после него —
            // так Mini App и /app открываются быстрее. Список файлов подставляет scripts/prerender.mjs.
            var chunks = "__APP_CHUNKS__";
            if (chunks.indexOf("__") !== 0) chunks.split(",").forEach(function (href) {
              var l = document.createElement("link"); l.rel = "modulepreload"; l.crossOrigin = ""; l.href = href; document.head.appendChild(l);
            });
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { background: #08090B; }
      .app-mode #prerender { display: none }
      #prerender ~ .boot { display: none }
      .app-mode #prerender ~ .boot { display: flex }
      .boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .boot span { display: inline-block; width: 7px; margin: 0 2.5px; border-radius: 7px; background: linear-gradient(135deg,#D4FF5C,#38E0C8); transform-origin: bottom; animation: boot 1.1s ease-in-out infinite; }
      .boot span:nth-child(2) { animation-delay: .14s } .boot span:nth-child(3) { animation-delay: .28s } .boot span:nth-child(4) { animation-delay: .42s }
      @keyframes boot { 0%,100% { transform: scaleY(.45) } 50% { transform: scaleY(1) } }
    </style>
  </head>
  <body style="margin: 0; background: #08090B">
    <div id="root"><!--prerender--><div class="boot" aria-label="Загрузка"><div style="display:flex;align-items:flex-end;height:40px"><span style="height:22px"></span><span style="height:40px"></span><span style="height:29px"></span><span style="height:15px"></span></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
