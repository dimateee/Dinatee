[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Секретные ключи сюда НЕ пишем: функции их отсюда не видят.
# BOT_TOKEN добавляется в интерфейсе Netlify: Site configuration → Environment variables.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
